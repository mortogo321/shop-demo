name: shop-demo-dev

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - 8000:3000
    environment:
      NODE_ENV: development
      PORT: 3000
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
