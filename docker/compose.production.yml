name: shop-demo-prod

services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      NODE_ENV: production
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
